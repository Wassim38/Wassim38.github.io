<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hwmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="hwmsAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="hardisRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#hwmsBg)" />

  <!-- Ambient Light -->
  <circle cx="200" cy="180" r="180" fill="#06b6d4" opacity="0.12" filter="url(#hGlow)" />
  <circle cx="650" cy="350" r="160" fill="#3b82f6" opacity="0.14" filter="url(#hGlow)" />

  <!-- Main Window -->
  <g transform="translate(80, 50)">
    <!-- Shadow & Body -->
    <rect x="0" y="0" width="640" height="400" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="640" height="42" rx="14" fill="#111827" />
    <rect x="0" y="22" width="640" height="20" fill="#111827" />
    <line x1="0" y1="42" x2="640" y2="42" stroke="#1e293b" stroke-width="1" />

    <!-- Window buttons -->
    <circle cx="22" cy="21" r="5" fill="#ef4444" />
    <circle cx="38" cy="21" r="5" fill="#f59e0b" />
    <circle cx="54" cy="21" r="5" fill="#10b981" />

    <text x="320" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      Hardis WMS — Visualiseur de Fichiers Journaux &amp; Diagnostic MCO
    </text>

    <!-- Top Stats Bar inside window -->
    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="185" height="56" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <text x="14" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">ENVIRONNEMENT</text>
      <text x="14" y="44" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">AS400 / IBM i &amp; Web</text>

      <rect x="205" y="0" width="185" height="56" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <text x="14" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">REQUÊTES SQL DB2</text>
      <text x="14" y="44" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">0.04s (Optimisées)</text>

      <rect x="410" y="0" width="190" height="56" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <text x="14" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">TEMPS DE DIAGNOSTIC</text>
      <text x="14" y="44" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="700">-65% en Production</text>
    </g>

    <!-- Log Console Body -->
    <g transform="translate(20, 126)">
      <rect x="0" y="0" width="600" height="254" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1" />
      
      <!-- Filter controls -->
      <rect x="12" y="12" width="140" height="28" rx="6" fill="#1e293b" />
      <text x="24" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="11">🔍 Filtrer journal...</text>
      
      <rect x="162" y="12" width="90" height="28" rx="6" fill="#1e293b" />
      <text x="175" y="30" fill="#f87171" font-family="sans-serif" font-size="11">● CRITICAL (0)</text>

      <rect x="260" y="12" width="85" height="28" rx="6" fill="#1e293b" />
      <text x="273" y="30" fill="#fbbf24" font-family="sans-serif" font-size="11">▲ WARN (2)</text>

      <rect x="353" y="12" width="80" height="28" rx="6" fill="#1e293b" />
      <text x="366" y="30" fill="#34d399" font-family="sans-serif" font-size="11">✔ OK (418)</text>

      <!-- Terminal Log Lines -->
      <g transform="translate(14, 58)" font-family="monospace" font-size="11">
        <text y="14" fill="#64748b">[2024-05-14 09:12:01.402] <tspan fill="#38bdf8">INFO</tspan>  [HSC-WMS:SRV01] Flux EDI Réception palettes quai A-12 traité (48 colis)</text>
        <text y="36" fill="#64748b">[2024-05-14 09:12:02.115] <tspan fill="#34d399">SUCC</tspan>  [DB2:POOL_03] Transaction SQL commitée avec succès (latency: 18ms)</text>
        <text y="58" fill="#64748b">[2024-05-14 09:12:03.042] <tspan fill="#fbbf24">WARN</tspan>  [DISP:LOG_09] Temporisation franchie sur capteur convoyeur B3 - Réessai auto</text>
        <text y="80" fill="#64748b">[2024-05-14 09:12:03.208] <tspan fill="#34d399">SUCC</tspan>  [DISP:LOG_09] Capteur B3 acquitté - Reprise opérationnelle immédiate</text>
        <text y="102" fill="#64748b">[2024-05-14 09:12:04.992] <tspan fill="#38bdf8">INFO</tspan>  [AS400:JOB_ADL] Programme Adélia WMS_EXPEDITION terminé en 320ms</text>
        <text y="124" fill="#64748b">[2024-05-14 09:12:05.310] <tspan fill="#a855f7">DIAG</tspan>  [MONITOR] Statut MCO stable - 0 incident bloquant</text>
      </g>

      <!-- Bottom Floating Badge -->
      <g transform="translate(340, 194)">
        <rect x="0" y="0" width="246" height="44" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
        <text x="14" y="27" fill="#e0e7ff" font-family="sans-serif" font-size="12" font-weight="700">Hardis Supply Chain • Adélia &amp; Web</text>
      </g>
    </g>
  </g>
</svg>
