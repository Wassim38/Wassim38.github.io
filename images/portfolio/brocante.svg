<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Background Glow Orb -->
  <circle cx="400" cy="220" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="650" cy="380" r="100" fill="#ec4899" opacity="0.1" filter="url(#glow)" />

  <!-- Desktop App Window Mockup -->
  <g transform="translate(100, 60)">
    <!-- Window Shadow & Frame -->
    <rect x="0" y="0" width="600" height="380" rx="14" fill="#0b0f19" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="600" height="42" rx="14" fill="#1e293b" />
    <rect x="0" y="20" width="600" height="22" fill="#1e293b" />
    <line x1="0" y1="42" x2="600" y2="42" stroke="#334155" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="22" cy="21" r="5" fill="#ef4444" />
    <circle cx="38" cy="21" r="5" fill="#f59e0b" />
    <circle cx="54" cy="21" r="5" fill="#10b981" />

    <!-- Window Title -->
    <text x="300" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      Gestionnaire de Brocante — JavaFX App
    </text>

    <!-- Sidebar -->
    <rect x="1" y="43" width="130" height="336" fill="#0f172a" />
    <line x1="131" y1="43" x2="131" y2="379" stroke="#1e293b" stroke-width="1" />

    <!-- Sidebar Menu Items -->
    <rect x="12" y="65" width="106" height="26" rx="6" fill="url(#primaryGrad)" />
    <text x="36" y="82" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Tableau de bord</text>
    
    <rect x="12" y="103" width="106" height="26" rx="6" fill="transparent" />
    <text x="36" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11">Exposants</text>
    
    <rect x="12" y="139" width="106" height="26" rx="6" fill="transparent" />
    <text x="36" y="156" fill="#94a3b8" font-family="sans-serif" font-size="11">Emplacements</text>

    <rect x="12" y="175" width="106" height="26" rx="6" fill="transparent" />
    <text x="36" y="192" fill="#94a3b8" font-family="sans-serif" font-size="11">Transactions</text>

    <!-- Main Content Area -->
    <!-- Metric Cards -->
    <rect x="150" y="65" width="130" height="70" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="165" y="88" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">TOTAL STANDS</text>
    <text x="165" y="118" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="800">142 / 150</text>

    <rect x="295" y="65" width="130" height="70" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="310" y="88" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">EXPOSANTS</text>
    <text x="310" y="118" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="800">89 Validés</text>

    <rect x="440" y="65" width="140" height="70" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="455" y="88" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">RECETTES</text>
    <text x="455" y="118" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="800">4,250 €</text>

    <!-- Data Grid Mockup -->
    <rect x="150" y="155" width="430" height="205" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    
    <!-- Table Header -->
    <rect x="151" y="156" width="428" height="30" fill="#1e293b" />
    <text x="168" y="176" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">ID</text>
    <text x="210" y="176" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">EXPOSANT</text>
    <text x="330" y="176" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">ZONE</text>
    <text x="420" y="176" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">STATUT</text>
    <text x="510" y="176" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">PAIEMENT</text>

    <!-- Row 1 -->
    <line x1="151" y1="218" x2="579" y2="218" stroke="#1e293b" stroke-width="1" />
    <text x="168" y="208" fill="#cbd5e1" font-family="monospace" font-size="11">#014</text>
    <text x="210" y="208" fill="#f8fafc" font-family="sans-serif" font-size="11">Antiquités Grenobloises</text>
    <text x="330" y="208" fill="#94a3b8" font-family="sans-serif" font-size="11">Allée A-04</text>
    <rect x="420" y="196" width="56" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="0.8" />
    <text x="427" y="209" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="700">RÉSERVÉ</text>
    <text x="510" y="208" fill="#34d399" font-family="sans-serif" font-size="11">Payé (CB)</text>

    <!-- Row 2 -->
    <line x1="151" y1="250" x2="579" y2="250" stroke="#1e293b" stroke-width="1" />
    <text x="168" y="240" fill="#cbd5e1" font-family="monospace" font-size="11">#015</text>
    <text x="210" y="240" fill="#f8fafc" font-family="sans-serif" font-size="11">Collection Vinyles 38</text>
    <text x="330" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11">Allée B-12</text>
    <rect x="420" y="228" width="56" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="0.8" />
    <text x="427" y="241" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="700">RÉSERVÉ</text>
    <text x="510" y="240" fill="#34d399" font-family="sans-serif" font-size="11">Payé (Vir.)</text>

    <!-- Row 3 -->
    <line x1="151" y1="282" x2="579" y2="282" stroke="#1e293b" stroke-width="1" />
    <text x="168" y="272" fill="#cbd5e1" font-family="monospace" font-size="11">#016</text>
    <text x="210" y="272" fill="#f8fafc" font-family="sans-serif" font-size="11">Librairie & BD Rares</text>
    <text x="330" y="272" fill="#94a3b8" font-family="sans-serif" font-size="11">Allée C-01</text>
    <rect x="420" y="260" width="56" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="0.8" />
    <text x="427" y="273" fill="#f59e0b" font-family="sans-serif" font-size="9" font-weight="700">EN ATTENTE</text>
    <text x="510" y="272" fill="#f59e0b" font-family="sans-serif" font-size="11">En cours</text>

    <!-- Java & JavaFX Floating Badge -->
    <g transform="translate(370, 312)">
      <rect x="0" y="0" width="190" height="38" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" filter="url(#glow)" />
      <text x="15" y="24" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="700">☕ Java 17 + JavaFX + SQL</text>
    </g>
  </g>
</svg>
