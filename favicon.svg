<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
  </defs>

  <!-- Background squircle with gradient stroke -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#favGrad)" stroke-width="2.5" />

  <!-- Code bracket accent / Monogram -->
  <g fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <polyline points="14 26 8 32 14 38" />
    <polyline points="50 26 56 32 50 38" />
  </g>

  <!-- WL text -->
  <text x="32" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
    WL
  </text>

  <!-- Electric Cyan Dot -->
  <circle cx="44" cy="42" r="3" fill="#06b6d4" />
</svg>
